[workspace]
resolver = "3"
members = ["crates/gpm-core", "src-tauri"]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
ts-rs = { version = "12", features = ["uuid-impl", "chrono-impl"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
