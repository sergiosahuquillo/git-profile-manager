<pre><code><span class="c"># Generated by GitProfile Manager. Do not edit by hand.</span>

<span class="c"># Rules: evaluated afterwards, they override the default profile.</span>
<span class="k">[includeIf <span class="s">"gitdir/i:C:/dev/company-a/"</span>]</span>

<span class="k">[includeIf <span class="s">"hasconfig:remote.*.url:git@github.com:company-a/**"</span>]</span>
